<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--sable:#fbf6ec;--sable-2:#f3e8d3;--creme:#fffdf8;--bordure:#e6d5b5;--or:#d9a73b;--or-clair:#f6e3b4;
--or-texte:#87601a;--brun:#3d2a1b;--brun-doux:#5c4330;--brun-logo:#9a712f;
--titres:"Lora",Georgia,serif;--texte:"Nunito","Segoe UI",Arial,sans-serif;--script:"Great Vibes",cursive}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{width:var(--w);height:var(--h);overflow:hidden;background:var(--creme);color:var(--brun);font-family:var(--texte)}
.page{position:relative;width:var(--w);height:var(--h);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ico{width:1em;height:1em;flex:none;color:var(--or-texte)}
.titre{font-family:var(--titres);font-weight:600;line-height:1.15;margin:0;color:var(--brun)}
.surtitre{margin:0;font-weight:800;text-transform:uppercase;letter-spacing:.22em;color:var(--or-texte)}
.etoiles{margin:0;color:#b9801a;letter-spacing:.14em}
.sous{margin:0;color:var(--brun-doux)}
.page{display:block;background:linear-gradient(180deg,var(--creme) 0%,var(--sable-2) 100%)}
.deco{position:absolute;border-radius:50%;background:#f6e3b4;opacity:.45}
.logo{position:absolute;left:70px;top:58px;width:250px;height:auto}
.photo{position:absolute;left:660px;top:70px;width:350px;height:350px;border-radius:50%;overflow:hidden;border:9px solid var(--or);box-shadow:0 16px 38px rgba(92,67,48,.25)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 38%}
.texte{position:absolute;left:70px;top:160px;width:590px;text-align:left}
.surtitre{font-size:26px}
.titre{font-family:var(--titres);font-weight:600;font-size:62px;line-height:1.08;margin:12px 0 16px;color:var(--brun)}
.valeur{display:inline-block;background:var(--or);color:var(--brun);font-weight:800;font-size:28px;padding:8px 22px;border-radius:999px;box-shadow:0 8px 18px rgba(217,167,59,.4)}
.regles{position:absolute;left:70px;right:70px;top:468px}
.regles h2{font-family:var(--titres);font-weight:600;font-size:34px;margin:0 0 10px;color:var(--or-texte);text-align:left}
.regle{display:flex;align-items:center;gap:26px;background:var(--creme);border:2px solid var(--bordure);border-radius:28px;padding:6px 30px;margin-bottom:10px;box-shadow:0 8px 22px rgba(92,67,48,.08);text-align:left}
.regle .n{width:50px;height:50px;border-radius:50%;border:4px solid var(--or);background:var(--creme);display:flex;align-items:center;justify-content:center;font-family:var(--titres);font-weight:600;font-size:34px;color:var(--or-texte);flex:none}
.regle span{font-size:36px;font-weight:700;color:var(--brun)}
.tirage{position:absolute;left:70px;right:70px;bottom:36px;background:linear-gradient(135deg,var(--brun) 0%,#5b3f26 100%);border-radius:30px;padding:12px 20px;text-align:center}
.tirage b{display:block;font-family:var(--titres);font-weight:600;font-size:44px;color:var(--or-clair)}
.tirage span{display:block;margin-top:4px;font-size:26px;color:#f3e8d3;font-weight:700}</style>
</head>
