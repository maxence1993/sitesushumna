<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Palette du site : crème #fffdf8, sable #f3e8d3, or #d9a73b, or clair #f6e3b4, brun #3d2a1b, brun logo #9a712f -->
  <defs>
    <radialGradient id="fond" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3e8d3"/>
    </radialGradient>
    <linearGradient id="peau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d9b6"/><stop offset="1" stop-color="#ebc195"/>
    </linearGradient>
    <linearGradient id="serviette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3b64e"/><stop offset="1" stop-color="#d09a2a"/>
    </linearGradient>
    <linearGradient id="debardeur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f3825"/><stop offset="1" stop-color="#3d2a1b"/>
    </linearGradient>
    <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1e6cc"/><stop offset=".5" stop-color="#d9c8a0"/><stop offset="1" stop-color="#b79f6f"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2a85a"/><stop offset="1" stop-color="#8a6527"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#fond)"/>
  <circle cx="540" cy="520" r="430" fill="#f6e3b4" opacity=".55"/>
  <circle cx="540" cy="520" r="430" fill="none" stroke="#d9a73b" stroke-width="7"/>

  <g fill="#d9a73b">
    <path d="M868 196 q10 36 46 46 q-36 10 -46 46 q-10 -36 -46 -46 q36 -10 46 -46z"/>
    <path d="M214 262 q7 26 33 33 q-26 7 -33 33 q-7 -26 -33 -33 q26 -7 33 -33z"/>
    <path d="M330 140 q5 17 22 22 q-17 5 -22 22 q-5 -17 -22 -22 q17 -5 22 -22z" opacity=".75"/>
    <circle cx="936" cy="340" r="8"/><circle cx="152" cy="430" r="7" opacity=".8"/>
  </g>

<g transform="translate(540 520) scale(.78) translate(-540 -520)">
  <ellipse cx="540" cy="944" rx="330" ry="20" fill="#9a712f" opacity=".16"/>

  <!-- MASSEUR (derrière la table) -->
  <g>
    <path d="M432 580 Q444 462 558 450 L650 450 Q764 462 772 570 L772 700 L432 700 Z" fill="url(#debardeur)"/>
    <circle cx="470" cy="544" r="42" fill="#ebc195"/>
    <circle cx="738" cy="544" r="42" fill="#ebc195"/>
    <rect x="560" y="392" width="90" height="90" rx="32" fill="#e4b88c"/>
    <path d="M556 452 Q604 504 654 452 L654 472 Q604 524 556 472Z" fill="#e4b88c"/>
    <!-- oreilles -->
    <circle cx="492" cy="324" r="27" fill="#f1cca3"/><circle cx="492" cy="324" r="13" fill="#e4b88c"/>
    <circle cx="712" cy="324" r="27" fill="#ebc195"/><circle cx="712" cy="324" r="13" fill="#e4b88c" opacity=".8"/>
    <!-- visage -->
    <ellipse cx="602" cy="308" rx="114" ry="126" fill="url(#peau)"/>

    <!-- cheveux gris argenté : côtés très courts, dessus plus long, balayé et texturé -->
    <path d="M496 256 Q484 176 556 142 Q642 104 716 158 Q752 196 726 258 Q706 212 664 206 Q612 196 560 216 Q518 230 496 256Z" fill="#bcb7bd"/>
    <path d="M520 214 Q548 180 600 176 Q660 172 704 210 Q650 196 606 202 Q556 208 520 214Z" fill="#a9a4ab" opacity=".55"/>
    <g fill="none" stroke-linecap="round">
      <path d="M552 178 Q538 138 584 120" stroke="#cdc8ce" stroke-width="15"/>
      <path d="M604 166 Q610 114 664 120" stroke="#d6d2d8" stroke-width="15"/>
      <path d="M664 174 Q702 136 734 172" stroke="#cdc8ce" stroke-width="14"/>
      <path d="M528 204 Q500 170 524 142" stroke="#c4bfc6" stroke-width="13"/>
      <path d="M572 150 Q590 130 612 140" stroke="#ece9ee" stroke-width="6" opacity=".9"/>
      <path d="M640 140 Q660 124 682 140" stroke="#ece9ee" stroke-width="6" opacity=".8"/>
    </g>

    <!-- sourcils -->
    <path d="M548 272 Q574 254 602 268" stroke="#6b5a4e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M634 268 Q662 254 688 272" stroke="#6b5a4e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- yeux baissés -->
    <path d="M554 302 Q574 318 596 302" stroke="#3d2a1b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M640 302 Q662 318 682 302" stroke="#3d2a1b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="548" cy="350" rx="21" ry="12" fill="#e9a283" opacity=".4"/>
    <ellipse cx="658" cy="350" rx="21" ry="12" fill="#e9a283" opacity=".4"/>
    <path d="M620 316 Q614 342 628 346" stroke="#c99468" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- barbe courte -->
    <path d="M540 368 Q550 430 602 442 Q654 430 664 368 Q642 398 602 400 Q562 398 540 368Z" fill="#7a5a3a"/>
    <path d="M572 356 Q602 342 634 356 Q602 368 572 356Z" fill="#7a5a3a"/>
    <path d="M586 380 Q602 392 618 380" stroke="#f6e3b4" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- BOUCLES D'OREILLES — oreille gauche : gros anneau champagne -->
    <g transform="translate(-4 2) translate(484 348) scale(.62) translate(-484 -348)">
      <path d="M484 346 Q462 356 462 384 Q464 410 488 412 Q500 400 490 384 Q482 372 492 358Z" fill="url(#champagne)" stroke="#a98f5f" stroke-width="2.5"/>
      <path d="M472 372 Q472 392 484 402" stroke="#fbf5e3" stroke-width="4" fill="none" stroke-linecap="round" opacity=".85"/>
    </g>
    <!-- oreille droite : griffe à pointes en bronze -->
    <g transform="translate(14 4) translate(722 352) scale(.62) translate(-722 -352)">
      <!-- griffe -->
      <path d="M722 350 Q744 354 744 396 Q742 424 732 444 Q716 420 714 384 Q712 362 722 350Z" fill="url(#bronze)" stroke="#6b4a1f" stroke-width="2.5"/>
      <circle cx="728" cy="370" r="3.6" fill="#f3dca0" stroke="#6b4a1f" stroke-width="1.2"/>
      <circle cx="729" cy="390" r="3.6" fill="#f3dca0" stroke="#6b4a1f" stroke-width="1.2"/>
      <path d="M714 420 Q728 428 742 418" stroke="#6b4a1f" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="3 3"/>
      <path d="M724 426 Q730 446 736 466 Q740 448 742 424Z" fill="#d9a73b" stroke="#6b4a1f" stroke-width="2"/>
    </g>
  </g>

  <!-- JAMBES du masseur, vues à travers la table -->
  <g>
    <path d="M468 690 L604 690 L596 806 L484 806 Z" fill="#3d2a1b"/>
    <path d="M608 690 L762 690 L752 806 L618 806 Z" fill="#3d2a1b"/>
    <rect x="514" y="800" width="52" height="100" rx="22" fill="#ebc195"/>
    <rect x="648" y="800" width="52" height="100" rx="22" fill="#ebc195"/>
    <rect x="510" y="886" width="60" height="38" rx="14" fill="#3d2a1b"/>
    <rect x="644" y="886" width="60" height="38" rx="14" fill="#3d2a1b"/>
    <ellipse cx="538" cy="930" rx="46" ry="16" fill="#3d2a1b"/>
    <ellipse cx="674" cy="930" rx="46" ry="16" fill="#3d2a1b"/>
  </g>

  <!-- pieds de table -->
  <rect x="212" y="716" width="38" height="218" rx="12" fill="#9a712f"/>
  <rect x="830" y="716" width="38" height="218" rx="12" fill="#9a712f"/>
  <rect x="212" y="842" width="656" height="20" rx="10" fill="#87601a"/>

  <!-- matelas -->
  <rect x="124" y="648" width="832" height="80" rx="40" fill="#fffdf8" stroke="#e6d5b5" stroke-width="6"/>

  <!-- CLIENT allongé sur le ventre, entièrement recouvert par la serviette -->
  <g>
    <!-- nuque -->
    <path d="M244 640 Q262 612 296 600 L304 650 L240 650Z" fill="#f1d3ae"/>
    <!-- tête, cheveux bruns, oreille -->
    <ellipse cx="212" cy="608" rx="48" ry="44" fill="#f1d3ae"/>
    <path d="M166 602 Q168 556 214 556 Q266 560 260 610 Q252 582 214 582 Q184 584 166 602Z" fill="#5c4330"/>
    <ellipse cx="228" cy="618" rx="10" ry="14" fill="#e4b88c"/>
    <ellipse cx="170" cy="618" rx="8" ry="7" fill="#f1d3ae"/>
    <!-- serviette moutarde sur tout le corps -->
    <path d="M262 650 Q270 592 346 578 Q450 566 556 574 Q690 558 782 584 Q862 606 874 650 Z" fill="url(#serviette)"/>
    <!-- plis doux, plus clairs que la serviette -->
    <g fill="none" stroke="#f3d27e" stroke-linecap="round" stroke-width="6" opacity=".75">
      <path d="M330 600 Q352 618 346 646"/>
      <path d="M520 590 Q540 612 534 646"/>
      <path d="M746 596 Q768 618 764 646"/>
    </g>
  </g>

  <!-- BRAS du masseur : les mains posent sur le dos -->
  <g stroke-linecap="round" fill="none">
    <path d="M474 548 Q446 594 434 630" stroke="#ebc195" stroke-width="68"/>
    <path d="M740 548 Q752 602 676 636" stroke="#ebc195" stroke-width="68"/>
  </g>
  <ellipse cx="428" cy="636" rx="45" ry="31" transform="rotate(-25 428 636)" fill="#f1cca3"/>
  <ellipse cx="660" cy="642" rx="45" ry="31" transform="rotate(20 660 642)" fill="#f1cca3"/>
  <path d="M482 564 Q460 598 448 620" stroke="#f6d9b6" stroke-width="11" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M742 564 Q748 598 706 622" stroke="#f6d9b6" stroke-width="11" fill="none" stroke-linecap="round" opacity=".8"/>
</g>
</svg>
