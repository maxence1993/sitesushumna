<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Palette du site : crème #fffdf8, sable #f3e8d3, or #d9a73b, or clair #f6e3b4, brun #3d2a1b, brun logo #9a712f -->
  <defs>
    <radialGradient id="fond" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3e8d3"/>
    </radialGradient>
    <linearGradient id="peau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d9b6"/>
      <stop offset="1" stop-color="#ebc195"/>
    </linearGradient>
    <linearGradient id="serviette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3b64e"/>
      <stop offset="1" stop-color="#d09a2a"/>
    </linearGradient>
    <linearGradient id="debardeur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f3825"/>
      <stop offset="1" stop-color="#3d2a1b"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#fond)"/>

  <!-- halo doré, comme les couvertures à la une -->
  <circle cx="540" cy="520" r="430" fill="#f6e3b4" opacity=".55"/>
  <circle cx="540" cy="520" r="430" fill="none" stroke="#d9a73b" stroke-width="7"/>

  <!-- étincelles dorées -->
  <g fill="#d9a73b">
    <path d="M868 196 q10 36 46 46 q-36 10 -46 46 q-10 -36 -46 -46 q36 -10 46 -46z"/>
    <path d="M214 262 q7 26 33 33 q-26 7 -33 33 q-7 -26 -33 -33 q26 -7 33 -33z"/>
    <path d="M330 140 q5 17 22 22 q-17 5 -22 22 q-5 -17 -22 -22 q17 -5 22 -22z" opacity=".75"/>
    <circle cx="936" cy="340" r="8"/><circle cx="152" cy="430" r="7" opacity=".8"/>
  </g>

  <!-- ombre au sol -->
  <g transform="translate(540 552) scale(.88) translate(-540 -552)">
  <ellipse cx="540" cy="862" rx="330" ry="20" fill="#9a712f" opacity=".16"/>

  <!-- MASSEUR (derrière la table) -->
  <g>
    <path d="M432 580 Q444 462 558 450 L650 450 Q764 462 772 570 L772 650 L432 650 Z" fill="url(#debardeur)"/>
    <circle cx="470" cy="544" r="42" fill="#ebc195"/>
    <circle cx="738" cy="544" r="42" fill="#ebc195"/>
    <rect x="560" y="392" width="90" height="90" rx="32" fill="#e4b88c"/>
    <path d="M556 452 Q604 504 654 452 L654 472 Q604 524 556 472Z" fill="#e4b88c"/>
    <!-- oreilles + boucle dorée -->
    <circle cx="492" cy="324" r="27" fill="#f1cca3"/>
    <circle cx="492" cy="324" r="13" fill="#e4b88c"/>
    <circle cx="712" cy="324" r="27" fill="#ebc195"/>
    <circle cx="490" cy="358" r="15" fill="none" stroke="#d9a73b" stroke-width="7"/>
    <!-- visage -->
    <ellipse cx="602" cy="308" rx="114" ry="126" fill="url(#peau)"/>
    <!-- cheveux blond cendré, mèche relevée -->
    <path d="M488 306 Q466 204 552 164 Q654 116 734 192 Q766 246 718 316 Q708 266 664 246 Q602 228 546 256 Q508 274 488 306Z" fill="#d9b66f"/>
    <path d="M524 206 Q556 94 696 114 Q752 130 742 172 Q672 152 638 202 Q592 172 524 206Z" fill="#ecd39b"/>
    <path d="M492 304 Q496 354 514 374 Q500 332 504 298Z" fill="#c29c54" opacity=".8"/>
    <!-- sourcils -->
    <path d="M548 272 Q574 254 602 268" stroke="#8a6240" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M634 268 Q662 254 688 272" stroke="#8a6240" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- yeux baissés, concentré et serein -->
    <path d="M554 302 Q574 318 596 302" stroke="#3d2a1b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M640 302 Q662 318 682 302" stroke="#3d2a1b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- joues -->
    <ellipse cx="548" cy="350" rx="21" ry="12" fill="#e9a283" opacity=".4"/>
    <ellipse cx="658" cy="350" rx="21" ry="12" fill="#e9a283" opacity=".4"/>
    <!-- nez -->
    <path d="M620 316 Q614 342 628 346" stroke="#c99468" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- barbe courte -->
    <path d="M540 368 Q550 430 602 442 Q654 430 664 368 Q642 398 602 400 Q562 398 540 368Z" fill="#9a712f"/>
    <path d="M572 356 Q602 342 634 356 Q602 368 572 356Z" fill="#9a712f"/>
    <path d="M586 380 Q602 392 618 380" stroke="#f6e3b4" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- pieds de table -->
  <rect x="212" y="716" width="38" height="140" rx="12" fill="#9a712f"/>
  <rect x="830" y="716" width="38" height="140" rx="12" fill="#9a712f"/>
  <rect x="212" y="790" width="656" height="20" rx="10" fill="#87601a"/>

  <!-- matelas -->
  <rect x="124" y="648" width="832" height="80" rx="40" fill="#fffdf8" stroke="#e6d5b5" stroke-width="6"/>

  <!-- CLIENT allongé -->
  <g>
    <path d="M214 656 Q232 576 372 572 Q540 558 706 584 Q832 600 852 656 Z" fill="#f1d3ae"/>
    <g stroke="#9a712f" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7">
      <path d="M548 634 Q540 604 566 596 Q590 592 596 616 Q616 602 632 620 Q640 638 618 642"/>
      <path d="M566 632 Q570 612 586 614"/>
      <path d="M520 642 Q534 618 550 624"/>
    </g>
    <path d="M168 656 Q170 544 334 548 Q444 556 484 656 Z" fill="url(#serviette)"/>
    <path d="M250 566 Q300 606 290 654" stroke="#b9801a" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>
    <path d="M350 562 Q398 604 392 654" stroke="#b9801a" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>
    <circle cx="196" cy="612" r="44" fill="#5c4330"/>
  </g>

  <!-- BRAS du masseur : les mains posent sur le dos -->
  <g stroke-linecap="round" fill="none">
    <path d="M474 548 Q446 594 434 630" stroke="#ebc195" stroke-width="68"/>
    <path d="M740 548 Q752 602 676 636" stroke="#ebc195" stroke-width="68"/>
  </g>
  <ellipse cx="428" cy="636" rx="45" ry="31" transform="rotate(-25 428 636)" fill="#f1cca3"/>
  <ellipse cx="660" cy="642" rx="45" ry="31" transform="rotate(20 660 642)" fill="#f1cca3"/>
  <path d="M482 564 Q460 598 448 620" stroke="#f6d9b6" stroke-width="11" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M742 564 Q748 598 706 622" stroke="#f6d9b6" stroke-width="11" fill="none" stroke-linecap="round" opacity=".8"/>
</g>
</svg>
